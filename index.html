                                    <div className="grid md:grid-cols-2 gap-6">
                                        <div>
                                            <h3 className="text-xl font-bold text-gray-800 mb-4 flex items-center">
                                                <i className="fas fa-map-marker-alt text-blue-500 mr-2"></i>Places to See & Walks
                                            </h3>
                                            <div className="space-y-4">
                                                {currentDay.stops.map((stop, idx) => (
                                                    <div key={idx} className="border-l-4 border-blue-500 pl-4 py-2">
                                                        <div className="flex items-center gap-2 mb-1">
                                                            {stop.type === 'walk' && <span className="px-2 py-1 bg-green-100 text-green-700 rounded text-xs font-semibold">WALK</span>}
                                                            {stop.type === 'highlight' && <span className="px-2 py-1 bg-amber-100 text-amber-700 rounded text-xs font-semibold">MUST SEE</span>}
                                                            {stop.type === 'stop' && <span className="px-2 py-1 bg-gray-100 text-gray-700 rounded text-xs font-semibold">STOP</span>}
                                                            <h4 className="font-bold text-gray-800">{stop.name}</h4>
                                                        </div>
                                                        {stop.difficulty && (
                                                            <p className="text-sm text-gray-500 mb-1">
                                                                <i className="fas fa-hiking mr-1"></i>{stop.difficulty} • {stop.time}
                                                            </p>
                                                        )}
                                                        <p className="text-gray-600 text-sm">{stop.description}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        <div>
                                            <h3 className="text-xl font-bold text-gray-800 mb-4 flex items-center">
                                                <i className="fas fa-campground text-emerald-500 mr-2"></i>Where to Stay
                                            </h3>
                                            <div className="space-y-4">
                                                {currentDay.camping.map((camp, idx) => (
                                                    <div key={idx} className="bg-gradient-to-r from-emerald-50 to-blue-50 rounded-xl p-4">
                                                        <div className="flex justify-between items-start mb-2">
                                                            <h4 className="font-bold text-gray-800">{camp.name}</h4>
                                                            <span className="px-2 py-1 bg-emerald-500 text-white rounded text-sm font-semibold">{camp.cost}</span>
                                                        </div>
                                                        <p className="text-sm text-gray-600 mb-2">
                                                            <span className="font-semibold text-emerald-700">{camp.type}</span> • {camp.facilities}
                                                        </p>
                                                        <p className="text-sm text-gray-500 italic">{camp.note}</p>
                                                    </div>
                                                ))}
                                            </div>

                                            <div className="mt-6 p-4 bg-amber-50 rounded-xl border border-amber-200">
                                                <h4 className="font-bold text-amber-800 mb-2 flex items-center">
                                                    <i className="fas fa-lightbulb mr-2"></i>Pro Tip
                                                </h4>
                                                <p className="text-sm text-amber-700">
                                                    Book campsites in advance when possible (DOC campsites can be booked online). Have backup options as popular spots fill up fast in summer!
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="grid md:grid-cols-3 gap-4">
                                <div className="bg-white p-6 rounded-xl shadow-md text-center">
                                    <i className="fas fa-road text-4xl text-blue-500 mb-3"></i>
                                    <h4 className="font-bold text-gray-800">Total Distance</h4>
                                    <p className="text-2xl font-bold text-blue-600">~800 km</p>
                                </div>
                                <div className="bg-white p-6 rounded-xl shadow-md text-center">
                                    <i className="fas fa-clock text-4xl text-emerald-500 mb-3"></i>
                                    <h4 className="font-bold text-gray-800">Driving Time</h4>
                                    <p className="text-2xl font-bold text-emerald-600">~13 hours</p>
                                </div>
                                <div className="bg-white p-6 rounded-xl shadow-md text-center">
                                    <i className="fas fa-hiking text-4xl text-amber-500 mb-3"></i>
                                    <h4 className="font-bold text-gray-800">Walks Included</h4>
                                    <p className="text-2xl font-bold text-amber-600">10+ Tracks</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {activeTab === 'tips' && (
                        <div className="grid md:grid-cols-2 gap-6">
                            {practicalTips.map((tip, idx) => (
                                <div key={idx} className="bg-white rounded-xl shadow-lg p-6 hover:shadow-xl transition-shadow">
                                    <div className="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center mb-4">
                                        <i className={`fas ${tip.icon} text-2xl text-blue-600`}></i>
                                    </div>
                                    <h3 className="text-lg font-bold text-gray-800 mb-2">{tip.title}</h3>
                                    <p className="text-gray-600">{tip.content}</p>
                                </div>
                            ))}
                            
                            <div className="md:col-span-2 bg-gradient-to-r from-blue-600 to-emerald-600 rounded-xl shadow-lg p-6 text-white">
                                <h3 className="text-xl font-bold mb-4 flex items-center">
                                    <i className="fas fa-heart mr-2"></i>Remember
                                </h3>
                                <p className="mb-4">Northland is subtropical - expect warm days but pack layers for cool evenings. The roads are generally good but some campsites are on gravel roads. Take your time and enjoy the laid-back atmosphere!</p>
                                <div className="flex flex-wrap gap-3">
                                    <span className="px-3 py-1 bg-white/20 rounded-full text-sm">Respect nature</span>
                                    <span className="px-3 py-1 bg-white/20 rounded-full text-sm">Support local</span>
                                    <span className="px-3 py-1 bg-white/20 rounded-full text-sm">Leave no trace</span>
                                    <span className="px-3 py-1 bg-white/20 rounded-full text-sm">Have fun!</span>
                                </div>
                            </div>
                        </div>
                    )}

                    {activeTab === 'reverse' && (
                        <div>
                            <div className="bg-blue-50 rounded-xl p-6 mb-6 border border-blue-200">
                                <h3 className="text-xl font-bold text-blue-800 mb-2 flex items-center">
                                    <i className="fas fa-exchange-alt mr-2"></i>West Coast Up, East Coast Down
                                </h3>
                                <p className="text-blue-700">
                                    This is the reverse direction - going up the Hokianga/West Coast first, then returning down the East Coast. Good if you want to hit the giant trees and sand dunes early!
                                </p>
                            </div>

                            <div className="space-y-4">
                                {reversedDays.map((day) => (
                                    <div key={day.day} className="bg-white rounded-xl shadow-md overflow-hidden">
                                        <div className="flex flex-col md:flex-row">
                                            <div className="md:w-48 h-48 md:h-auto">
                                                <img src={day.image} alt={day.title} className="w-full h-full object-cover" />
                                            </div>
                                            <div className="p-6 flex-1">
                                                <div className="flex items-center gap-3 mb-2">
                                                    <span className="px-3 py-1 bg-blue-600 text-white rounded-full text-sm font-bold">Day {day.day}</span>
                                                    <span className="text-gray-500 text-sm">{day.distance} • {day.driveTime}</span>
                                                </div>
                                                <h3 className="text-xl font-bold text-gray-800 mb-2">{day.title}</h3>
                                                <div className="flex flex-wrap gap-2">
                                                    {day.highlights.map((h, i) => (
                                                        <span key={i} className="text-sm text-gray-600">
                                                            <i className="fas fa-check text-emerald-500 mr-1"></i>{h}
                                                        </span>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <div className="mt-6 p-4 bg-emerald-50 rounded-xl border border-emerald-200 text-center">
                                <p className="text-emerald-800 font-semibold">
                                    <i className="fas fa-info-circle mr-2"></i>
                                    Both routes are stunning! The original itinerary (East up, West down) has you finishing with the dramatic Waipoua Forest drive.
                                </p>
                            </div>
                        </div>
                    )}

                    <footer className="mt-12 text-center text-gray-500 text-sm pb-8">
                        <p>Safe travels Tom and Ella! 🚐🌊🌲</p>
                        <p className="mt-2">Created with ❤️ for your Northland adventure</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ItineraryApp />);
    </script>
</body>
</html>
