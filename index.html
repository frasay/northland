                                        onClick={() => setActiveTab('tips')}
                                        className={`px-3 py-2 md:px-6 md:py-3 rounded-full text-xs md:text-sm font-semibold transition-all ${activeTab === 'tips' ? 'bg-blue-600 text-white shadow-lg' : 'bg-white text-gray-700 hover:bg-blue-50'}`}
                                    >
                                        💡 Tips & Info
                                    </button>
                                </div>

                                {activeTab === 'itinerary' && (
                                    <div>
                                        <div className="flex flex-wrap justify-center gap-1 md:gap-2 mb-4 md:mb-6">
                                            {days.map((day) => (
                                                <button
                                                    key={day.day}
                                                    onClick={() => setSelectedDay(day.day)}
                                                    className={`px-2 py-1 md:px-4 md:py-2 rounded-full text-xs md:text-sm font-semibold transition-all ${selectedDay === day.day ? 'bg-emerald-500 text-white shadow-md' : 'bg-white text-gray-600 hover:bg-emerald-50'}`}
                                                >
                                                    Day {day.day}
                                                </button>
                                            ))}
                                        </div>

                                        <div className="bg-white rounded-2xl shadow-xl overflow-hidden mb-6 md:mb-8">
                                            <div className="relative h-48 md:h-64 lg:h-80">
                                                <img src={currentDay.image} alt={currentDay.title} className="w-full h-full object-cover" />
                                                <div className="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/70 to-transparent p-4 md:p-6">
                                                    <h2 className="text-lg md:text-2xl lg:text-3xl font-bold text-white">{currentDay.title}</h2>
                                                    <p className="text-white/90 mt-1 text-sm md:text-base">{currentDay.distance} • {currentDay.driveTime}</p>
                                                </div>
                                            </div>

                                            <div className="p-4 md:p-6">
                                                <div className="flex flex-wrap gap-1 md:gap-2 mb-4 md:mb-6">
                                                    {currentDay.highlights.map((highlight, idx) => (
                                                        <span key={idx} className="px-2 py-1 bg-emerald-100 text-emerald-700 rounded-full text-xs font-medium">
                                                            ✨ {highlight}
                                                        </span>
                                                    ))}
                                                </div>

                                                <div className="grid md:grid-cols-2 gap-4 md:gap-6">
                                                    <div>
                                                        <h3 className="text-lg md:text-xl font-bold text-gray-800 mb-3 md:mb-4 flex items-center">
                                                            📍 Places to See & Walks
                                                        </h3>
                                                        <div className="space-y-3 md:space-y-4">
                                                            {currentDay.stops.map((stop, idx) => (
                                                                <div key={idx} className="border-l-4 border-blue-500 pl-3 md:pl-4 py-1 md:py-2">
                                                                    <div className="flex flex-wrap items-center gap-1 md:gap-2 mb-1">
                                                                        {stop.type === 'walk' && <span className="px-2 py-0.5 bg-green-100 text-green-700 rounded text-xs font-semibold">WALK</span>}
                                                                        {stop.type === 'highlight' && <span className="px-2 py-0.5 bg-amber-100 text-amber-700 rounded text-xs font-semibold">MUST SEE</span>}
                                                                        {stop.type === 'stop' && <span className="px-2 py-0.5 bg-gray-100 text-gray-700 rounded text-xs font-semibold">STOP</span>}
                                                                        {stop.type === 'drive' && <span className="px-2 py-0.5 bg-blue-100 text-blue-700 rounded text-xs font-semibold">DRIVE</span>}
                                                                        {stop.type === 'end' && <span className="px-2 py-0.5 bg-purple-100 text-purple-700 rounded text-xs font-semibold">FINISH</span>}
                                                                        <h4 className="font-bold text-gray-800 text-sm md:text-base">{stop.name}</h4>
                                                                    </div>
                                                                    {stop.difficulty && (
                                                                        <p className="text-xs text-gray-500 mb-1">
                                                                            🥾 {stop.difficulty} • {stop.time}
                                                                        </p>
                                                                    )}
                                                                    <p className="text-gray-600 text-xs md:text-sm leading-relaxed">{stop.description}</p>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>

                                                    <div>
                                                        <h3 className="text-lg md:text-xl font-bold text-gray-800 mb-3 md:mb-4 flex items-center">
                                                            ⛺ Where to Stay
                                                        </h3>
                                                        <div className="space-y-3 md:space-y-4">
                                                            {currentDay.camping.map((camp, idx) => (
                                                                <div key={idx} className="bg-gradient-to-r from-emerald-50 to-blue-50 rounded-xl p-3 md:p-4">
                                                                    <div className="flex flex-col md:flex-row md:justify-between md:items-start gap-1 md:gap-2 mb-2">
                                                                        <h4 className="font-bold text-gray-800 text-sm md:text-base">{camp.name}</h4>
                                                                        <span className="px-2 py-1 bg-emerald-500 text-white rounded text-xs font-semibold self-start">{camp.cost}</span>
                                                                    </div>
                                                                    <p className="text-xs text-gray-600 mb-2">
                                                                        <span className="font-semibold text-emerald-700">{camp.type}</span> • {camp.facilities}
                                                                    </p>
                                                                    <p className="text-xs text-gray-500 italic">{camp.note}</p>
                                                                </div>
                                                            ))}
                                                        </div>

                                                        <div className="mt-4 md:mt-6 p-3 md:p-4 bg-amber-50 rounded-xl border border-amber-200">
                                                            <h4 className="font-bold text-amber-800 mb-1 md:mb-2 text-sm md:text-base">💡 Pro Tip</h4>
                                                            <p className="text-xs md:text-sm text-amber-700">
                                                                Book campsites in advance when possible. Have backup options as popular spots fill up fast in summer!
                                                            </p>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'tips' && (
                                    <div className="grid md:grid-cols-2 gap-4 md:gap-6">
                                        {practicalTips.map((tip, idx) => (
                                            <div key={idx} className="bg-white rounded-xl shadow-lg p-4 md:p-6 hover:shadow-xl transition-shadow">
                                                <div className="w-10 h-10 md:w-12 md:h-12 bg-blue-100 rounded-full flex items-center justify-center mb-3 md:mb-4">
                                                    <span className="text-xl md:text-2xl">💡</span>
                                                </div>
                                                <h3 className="text-base md:text-lg font-bold text-gray-800 mb-2">{tip.title}</h3>
                                                <p className="text-xs md:text-sm text-gray-600 leading-relaxed">{tip.content}</p>
                                            </div>
                                        ))}
                    
                                        <div className="md:col-span-2 bg-gradient-to-r from-blue-600 to-emerald-600 rounded-xl shadow-lg p-4 md:p-6 text-white">
                                            <h3 className="text-lg md:text-xl font-bold mb-3 md:mb-4">❤️ Remember</h3>
                                            <p className="text-xs md:text-sm mb-3 md:mb-4 leading-relaxed">Northland is subtropical - expect warm days but pack layers for cool evenings. The west coast is wilder and less developed than the east, with stunning sunsets over the water. Take your time and enjoy the laid-back atmosphere!</p>
                                            <div className="flex flex-wrap gap-2">
                                                <span className="px-3 py-1 bg-white/20 rounded-full text-xs md:text-sm">🌿 Respect nature</span>
                                                <span className="px-3 py-1 bg-white/20 rounded-full text-xs md:text-sm">🏪 Support local</span>
                                                <span className="px-3 py-1 bg-white/20 rounded-full text-xs md:text-sm">🗑️ Leave no trace</span>
                                                <span className="px-3 py-1 bg-white/20 rounded-full text-xs md:text-sm">😊 Have fun!</span>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                <footer className="mt-8 md:mt-12 text-center text-gray-500 text-xs md:text-sm pb-6 md:pb-8">
                                    <p className="mb-1">Safe travels Tom and Ella! 🚐🌊🌲</p>
                                    <p>Created with ❤️ for your 10-day Northland adventure</p>
                                </footer>
                            </div>
                        );
                    };

                    const root = ReactDOM.createRoot(document.getElementById('root'));
                    root.render(<ItineraryApp />);
                </script>
            </body>
            </html>
